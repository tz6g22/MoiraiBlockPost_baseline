seed: 42
mode: full
base_checkpoint: artifacts/models/Qwen3-1.7B
data_manifest: outputs/formal_retrain/shared/data/splits.json
data_config: configs/data_qwen3_1.7b.yaml
output_dir: outputs/formal_retrain/kimi_full
block_sizes: null
max_sequence_length: 4096
dtype: bfloat16
use_cache: false
gradient_checkpointing: true
training:
  task_order: [math, multihop]
  source_mix:
    math: {gsm8k: 1.0}
    multihop: {clutrr: 1.0}
  sampler: {mode: fixed_ratio_round_robin, seed: 42, pool_size_per_source: 1024}
  token_budget: {math: 500000, multihop: 500000}
  micro_batch_size: 1
  gradient_accumulation_steps: 1
  shuffle: false
  optimizer:
    name: AdamW
    backbone_lr: 5.0e-6
    attnres_lr: 3.0e-5
    query_lr: 3.0e-5
    backbone_weight_decay: 0.1
    attnres_weight_decay: 0.0
    betas: [0.9, 0.95]
    eps: 1.0e-8
  scheduler: {type: cosine, warmup_ratio: 0.03, min_lr_ratio: 0.1}
  max_grad_norm: 1.0
  metrics_window: 20
  metrics:
    validation_interval_steps: 100
    validation_examples_per_task: 32
distributed:
  strategy: fsdp
